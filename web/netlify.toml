[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/links/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/error"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://api.grlink.to/:splat"
  status = 200